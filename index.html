<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VALISH Beauty Salon &amp; Parlour</title>
<meta name="description" content="VALISH Beauty Salon and Parlour. Haircuts, colour, hair spa, facials, threading, manicure, pedicure and bridal makeup in Nepal.">
<meta name="theme-color" content="#1C1D1B">
<script>document.documentElement.className='js';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F4F1EC; --surface:#EAE5DD; --line:#D9D3C9;
  --ink:#1E1F1D; --muted:#6B6A66; --dark:#1C1D1B; --dark2:#262826;
  --sage:#5E7A68; --sage-d:#4B6455; --sage-l:#A9BDB0; --cream:#F4F1EC;
  --err:#A4493D;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pad:20px; --max:1200px;
  --ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:var(--sans);font-size:1.0625rem;line-height:1.6;color:var(--ink);background:var(--bg);overflow-x:clip;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{font-family:var(--serif);font-weight:350;line-height:1.05;letter-spacing:-.02em;font-variation-settings:"opsz" 120}
h2{font-size:clamp(2.1rem,7.2vw,4.3rem)}
.small{font-size:.9rem;color:var(--muted)}

/* ============ SPLASH ============ */
.splash{display:none}
.js .splash{display:flex;position:fixed;inset:0;z-index:100;background:var(--dark);color:var(--cream);align-items:center;justify-content:center;flex-direction:column;gap:22px;
  transition:transform 1s cubic-bezier(.77,0,.18,1);animation:splashFail 0s 6s forwards}
.splash.done{transform:translateY(-100%)}
@keyframes splashFail{to{visibility:hidden}}
.splash-logo{font-family:var(--serif);font-size:clamp(2.2rem,10vw,3.6rem);letter-spacing:.28em;font-weight:350;display:flex;overflow:hidden;padding:0 0 .1em .28em}
.splash-logo span{display:inline-block;transform:translateY(110%);animation:rise .9s var(--ease) forwards}
.splash-logo span:nth-child(2){animation-delay:.07s}.splash-logo span:nth-child(3){animation-delay:.14s}
.splash-logo span:nth-child(4){animation-delay:.21s}.splash-logo span:nth-child(5){animation-delay:.28s}.splash-logo span:nth-child(6){animation-delay:.35s}
@keyframes rise{to{transform:none}}
.splash-bar{width:120px;height:1px;background:rgba(244,241,236,.18);overflow:hidden}
.splash-bar i{display:block;height:100%;width:100%;background:var(--sage-l);transform:scaleX(0);transform-origin:left;animation:load 1.4s .3s var(--ease) forwards}
@keyframes load{to{transform:scaleX(1)}}

/* ============ NAV ============ */
.progress{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--sage);transform:scaleX(0);transform-origin:left;z-index:60}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);
  color:var(--ink);transition:background .35s,color .35s,box-shadow .35s}
.nav.solid{background:rgba(244,241,236,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 rgba(30,31,29,.07)}
.nav.dark{color:var(--cream)}
.nav.dark.solid{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.nav.open{color:var(--cream);background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--serif);font-weight:400;font-size:1.5rem;letter-spacing:.2em}
.logo small{font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-top:5px}
.nav-r{display:flex;align-items:center;gap:18px}
.nav-links{display:none;gap:28px;font-size:.95rem}
.nav-links a{position:relative;padding:4px 0}
.nav-links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav-links a:hover::after{transform:scaleX(1)}
.pill{display:none;align-items:center;height:42px;padding:0 22px;border-radius:99px;background:var(--sage);color:#fff;font-weight:500;font-size:.95rem;transition:background .25s,transform .25s}
.pill:hover{background:var(--sage-d);transform:translateY(-1px)}
.burger{width:44px;height:44px;display:grid;place-content:center;gap:6px}
.burger i{display:block;width:26px;height:1.5px;background:currentColor;transition:transform .4s var(--ease),opacity .2s}
.nav.open .burger i:nth-child(1){transform:translateY(3.75px) rotate(45deg)}
.nav.open .burger i:nth-child(2){transform:translateY(-3.75px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:45;background:var(--dark);color:var(--cream);display:flex;flex-direction:column;justify-content:center;padding:90px var(--pad) 40px;
  clip-path:circle(0 at calc(100% - 40px) 34px);transition:clip-path .8s cubic-bezier(.77,0,.18,1);visibility:hidden}
.menu.open{clip-path:circle(150% at calc(100% - 40px) 34px);visibility:visible}
.menu a.big{font-family:var(--serif);font-size:clamp(2.4rem,11vw,4rem);font-weight:300;letter-spacing:-.02em;line-height:1.25;display:block;overflow:hidden}
.menu a.big span{display:block;transform:translateY(110%);transition:transform .8s var(--ease)}
.menu.open a.big span{transform:none}
.menu.open a.big:nth-of-type(1) span{transition-delay:.25s}.menu.open a.big:nth-of-type(2) span{transition-delay:.32s}
.menu.open a.big:nth-of-type(3) span{transition-delay:.39s}.menu.open a.big:nth-of-type(4) span{transition-delay:.46s}.menu.open a.big:nth-of-type(5) span{transition-delay:.53s}
.menu p{margin-top:36px;color:rgba(244,241,236,.6);font-size:.95rem}

/* ============ HERO ============ */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;background:#141513;color:var(--cream);overflow:hidden;display:flex;align-items:flex-end}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:46% 50%;transform:scale(1.14);transform-origin:50% 62%}
.hero.ready .hero-img{animation:kb 2.8s var(--ease) forwards}
@keyframes kb{to{transform:scale(1)}}
.hero-shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(14,15,14,.9) 0%,rgba(14,15,14,.6) 30%,rgba(14,15,14,.05) 62%),linear-gradient(to bottom,rgba(14,15,14,.6),rgba(14,15,14,0) 24%)}
.hero-light{position:absolute;inset:-20% -40%;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;
  background:linear-gradient(105deg,transparent 34%,rgba(255,248,235,.55) 50%,transparent 66%);animation:sweep 16s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(-16%)}to{transform:translateX(16%)}}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-10px;border-radius:50%;background:rgba(255,248,235,.5);animation:drift linear infinite}
@keyframes drift{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.7}100%{transform:translate3d(var(--dx),-105vh,0);opacity:0}}

.hero-copy{position:relative;z-index:2;width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--pad) calc(48px + env(safe-area-inset-bottom))}
.hero h1{font-size:clamp(3.2rem,14vw,8rem);line-height:.95;font-weight:300;margin-bottom:20px}
.hero p{font-size:1.1rem;color:rgba(244,241,236,.86);max-width:27em}
.ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ln>span{display:block}
.js .hero .ln>span{transform:translateY(112%)}
.hero.ready .ln>span{transform:none;transition:transform 1.3s var(--ease)}
.hero.ready .ln:nth-of-type(2)>span{transition-delay:.12s}
.js .hero .fade{opacity:0;transform:translateY(18px)}
.hero.ready .fade{opacity:1;transform:none;transition:opacity 1s var(--ease) var(--fd,.3s),transform 1s var(--ease) var(--fd,.3s)}
.open{display:inline-flex;align-items:center;gap:10px;height:36px;padding:0 16px 0 14px;border-radius:99px;margin-bottom:26px;font-size:.86rem;
  background:rgba(20,21,20,.45);color:var(--cream);border:1px solid rgba(244,241,236,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.open i{width:8px;height:8px;border-radius:50%;background:#9ccaae;animation:ping 2.2s infinite}
.open.closed i{background:#b9b4aa;animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(156,202,174,.55)}70%,100%{box-shadow:0 0 0 9px rgba(156,202,174,0)}}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:54px;padding:0 30px;border-radius:99px;font-weight:500;font-size:1rem;transition:transform .3s var(--ease),background .25s,color .25s,border-color .25s}
.btn.fill{background:var(--cream);color:var(--dark)}
.btn.fill:hover{background:#fff;transform:translateY(-2px)}
.btn.sage{background:var(--sage);color:#fff}
.btn.sage:hover{background:var(--sage-d);transform:translateY(-2px)}
.btn.line{border:1px solid rgba(244,241,236,.5);color:var(--cream)}
.btn.line:hover{border-color:var(--cream);background:rgba(244,241,236,.1)}
.hint{position:absolute;right:var(--pad);bottom:calc(52px + env(safe-area-inset-bottom));z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:.78rem;color:rgba(244,241,236,.75);transition:opacity .4s}
.hint.gone{opacity:0}
@media (max-width:759px){.hint{display:none}}
.hint i{display:block;width:1px;height:46px;background:rgba(244,241,236,.25);position:relative;overflow:hidden}
.hint i::after{content:"";position:absolute;left:0;top:-50%;width:1px;height:50%;background:var(--cream);animation:scrollhint 1.8s ease-in-out infinite}
@keyframes scrollhint{to{top:110%}}

/* ============ MARQUEE ============ */
.mq{background:var(--sage);color:var(--cream);overflow:hidden;padding:26px 0;display:grid;gap:10px}
.mq-track{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}
.mq-track.rev{animation-direction:reverse;animation-duration:52s}
.mq-item{display:flex;align-items:center;gap:30px;padding-right:30px;font-family:var(--serif);font-weight:300;font-size:clamp(2rem,7vw,3.6rem);letter-spacing:-.02em;white-space:nowrap}
.mq-track.rev .mq-item{color:transparent;-webkit-text-stroke:1px rgba(244,241,236,.75)}
.mq-item svg{width:.8em;height:.8em;flex:none;color:var(--cream);opacity:.9}
.mq-track.rev .mq-item svg{color:rgba(244,241,236,.75)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ============ TRUST STRIP ============ */
.trust{padding:64px 0 54px}
.claims{display:grid;gap:22px}
.claim{display:flex;gap:16px;align-items:flex-start}
.claim svg{width:34px;height:34px;flex:none;color:var(--sage);margin-top:2px}
.claim h3{font-size:1.3rem;font-weight:400;line-height:1.2;margin-bottom:3px}
.claim p{font-size:.95rem;color:var(--muted);line-height:1.5}

/* ============ SNIP ============ */
.snip{position:relative;height:30px;margin:0 var(--pad)}
.snip::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.snip .cut{position:absolute;left:0;top:50%;height:0;border-top:2px dashed var(--ink);width:0}
.snip svg{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -4px;color:var(--ink);transform:rotate(90deg)}

/* ============ SERVICES ============ */
.services{background:var(--surface);padding:70px 0 90px}
.sec-head{display:grid;gap:14px;margin-bottom:34px}
.sec-head p{color:var(--muted);max-width:30em}
.tabs{position:relative;display:inline-flex;gap:4px;padding:5px;background:var(--bg);border-radius:99px;margin-bottom:12px}
.tabs button{position:relative;z-index:1;height:42px;padding:0 24px;border-radius:99px;font-weight:500;font-size:.95rem;color:var(--muted);transition:color .3s}
.tabs button[aria-selected="true"]{color:#fff}
.tabs .pillbg{position:absolute;z-index:0;top:5px;left:5px;height:42px;width:80px;border-radius:99px;background:var(--sage);transition:transform .5s var(--ease),width .5s var(--ease)}
.svc-list{list-style:none}
.svc{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:22px 0;border-top:1px solid var(--line);align-items:start;position:relative;
  transition:transform .4s var(--ease),background .3s;opacity:0;transform:translateY(24px)}
.svc.show{opacity:1;transform:none;transition:opacity .7s var(--ease) calc(var(--i)*.07s),transform .7s var(--ease) calc(var(--i)*.07s),background .3s}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc:hover{background:rgba(244,241,236,.55)}
.svc h3{font-size:1.55rem;font-weight:380;line-height:1.15;margin-bottom:4px}
.svc p{font-size:.95rem;color:var(--muted);max-width:26em;line-height:1.5}
.price{text-align:right;white-space:nowrap}
.price .cur{font-size:.75rem;color:var(--muted);margin-right:6px}
.price .num{font-family:var(--serif);font-size:1.9rem;font-weight:350;font-variant-numeric:tabular-nums}
.book-link{display:block;margin:6px 0 0 auto;font-size:.88rem;font-weight:500;color:var(--sage-d);position:relative;padding:4px 0}
.book-link::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(.25);transform-origin:right;transition:transform .4s var(--ease)}
.svc:hover .book-link::after,.book-link:focus-visible::after{transform:scaleX(1)}

/* ============ PROCESS ============ */
.process{position:relative;height:420vh;background:var(--dark);color:var(--cream)}
.process-in{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.p-head{position:absolute;top:84px;left:var(--pad);right:var(--pad);z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.p-head h2{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:300}
.p-bars{display:flex;gap:6px;flex:none;width:min(40vw,220px)}
.p-bars i{flex:1;height:3px;border-radius:3px;background:rgba(244,241,236,.18);position:relative;overflow:hidden}
.p-bars i b{position:absolute;inset:0;background:var(--sage-l);transform:scaleX(0);transform-origin:left}
.track{position:absolute;inset:0;display:flex;will-change:transform}
.panel{flex:0 0 100vw;width:100vw;height:100%;padding:150px var(--pad) 60px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.panel .num{position:absolute;right:var(--pad);top:120px;font-family:var(--serif);font-weight:300;font-size:clamp(9rem,46vw,22rem);line-height:.8;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px rgba(244,241,236,.16)}
.panel .ico{width:clamp(110px,34vw,190px);color:var(--sage-l);margin-bottom:34px;position:relative}
.panel h3{font-size:clamp(2.4rem,10vw,4.6rem);font-weight:300;margin-bottom:14px}
.panel p{color:rgba(244,241,236,.72);max-width:26em;font-size:1.08rem}
.panel .in-w{max-width:var(--max);margin:0 auto;width:100%}
.draw path,.draw circle,.draw line{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--ease)}
.panel.on .draw path,.panel.on .draw circle,.panel.on .draw line{stroke-dashoffset:0}
.sc-a,.sc-b{transform-origin:60px 60px;transform-box:view-box}
.panel.on .sc-a{animation:snipA 2.2s ease-in-out infinite}
.panel.on .sc-b{animation:snipB 2.2s ease-in-out infinite}
@keyframes snipA{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}}
@keyframes snipB{0%,100%{transform:rotate(9deg)}50%{transform:rotate(-7deg)}}
.panel.on .sparkle{animation:twinkle 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes twinkle{50%{transform:scale(.82) rotate(12deg);opacity:.7}}
.panel.on .dropl{animation:dropl 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dropl{50%{transform:translateY(6px)}}

/* ============ GALLERY ============ */
.gallery{padding:90px 0 80px}
.gal{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 var(--pad) 10px;margin:0 calc(var(--pad)*-1);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.tile{position:relative;flex:0 0 74vw;aspect-ratio:4/5;border-radius:18px;overflow:hidden;scroll-snap-align:center;background:var(--surface)}
.js .tile{clip-path:inset(9% 7% 9% 7% round 18px);transition:clip-path 1.2s var(--ease)}
.js .tile.in{clip-path:inset(0 round 18px)}
.ph{position:absolute;left:0;right:0;top:-7%;bottom:-7%;background-color:#3a3c39;background-repeat:no-repeat;will-change:transform}
.cap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;color:#fff;font-size:.92rem;background:linear-gradient(to top,rgba(20,21,20,.7),transparent)}
.gal-note{margin-top:18px}

/* ============ FAQ ============ */
.faq{background:var(--surface);padding:80px 0}
.faq-list{margin-top:28px;max-width:820px}
.qa{border-top:1px solid var(--line)}
.qa:last-child{border-bottom:1px solid var(--line)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;text-align:left;padding:22px 0;font-family:var(--serif);font-size:clamp(1.2rem,4.4vw,1.55rem);font-weight:350;letter-spacing:-.01em;line-height:1.25}
.qa .pm{position:relative;width:26px;height:26px;flex:none;border:1px solid var(--line);border-radius:50%;transition:background .3s,border-color .3s}
.qa .pm::before,.qa .pm::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:1.5px;background:var(--ink);transform:translate(-50%,-50%);transition:transform .45s var(--ease),background .3s}
.qa .pm::after{transform:translate(-50%,-50%) rotate(90deg)}
.qa.open .pm{background:var(--sage);border-color:var(--sage)}
.qa.open .pm::before,.qa.open .pm::after{background:#fff}
.qa.open .pm::after{transform:translate(-50%,-50%) rotate(0)}
.qa .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.qa.open .a{grid-template-rows:1fr}
.qa .a>div{overflow:hidden}
.qa .a p{padding:0 40px 24px 0;color:var(--muted);max-width:34em}

/* ============ BOOKING ============ */
.book{padding:90px 0}
.book-grid{display:grid;gap:40px}
.book-info p.lead{color:var(--muted);max-width:26em;margin:14px 0 30px}
.info-row{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
.info-row svg{width:22px;height:22px;color:var(--sage);flex:none;margin-top:3px}
.info-row small{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:#fff;border-radius:22px;padding:26px 22px;box-shadow:0 1px 0 rgba(30,31,29,.04),0 24px 60px -30px rgba(30,31,29,.25)}
.field{margin-bottom:18px}
.field label{display:block;font-size:.88rem;font-weight:500;margin-bottom:8px}
.field label em{font-style:normal;font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-size:1rem;color:var(--ink);transition:border-color .25s,box-shadow .25s;-webkit-appearance:none;appearance:none}
.field select{background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none' stroke='%236B6A66' stroke-width='1.6'><path d='M1 1.5l5 5 5-5'/></svg>") no-repeat right 16px center}
.field textarea{height:110px;padding:14px 16px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--sage);box-shadow:0 0 0 4px rgba(94,122,104,.18)}
.field.bad input,.field.bad select{border-color:var(--err)}
.err{display:block;min-height:0;font-size:.82rem;color:var(--err);margin-top:6px}
.row2{display:grid;gap:0 14px}
.submit{width:100%;height:56px;border-radius:99px;background:var(--sage);color:#fff;font-weight:500;font-size:1.02rem;transition:background .25s,transform .25s;display:flex;align-items:center;justify-content:center;gap:10px}
.submit:hover{background:var(--sage-d)}
.submit.loading{pointer-events:none;opacity:.85}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:none}
.submit.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.done-card{display:none;text-align:center;padding:14px 4px}
.done-card.show{display:block;animation:pop .7s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}}
.check{width:76px;height:76px;margin:0 auto 18px;color:var(--sage)}
.check circle,.check path{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1s .15s var(--ease) forwards}
.check path{animation-delay:.6s}
@keyframes dash{to{stroke-dashoffset:0}}
.done-card h3{font-size:1.7rem;margin-bottom:8px}
.sum{list-style:none;margin:20px 0 24px;border-top:1px solid var(--line);text-align:left}
.sum li{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.sum li span:first-child{color:var(--muted)}
.again{height:48px;padding:0 24px;border-radius:99px;border:1px solid var(--line);font-weight:500}
.again:hover{border-color:var(--sage)}

/* ============ CLOSING + FOOTER ============ */
.closing{background:var(--dark);color:var(--cream);padding:100px 0 70px;position:relative;overflow:hidden}
.closing h2{font-size:clamp(2.8rem,12.5vw,8rem);line-height:.98;font-weight:300;margin-bottom:38px}
.closing .glow{position:absolute;right:-20%;top:-30%;width:70vw;height:70vw;max-width:800px;max-height:800px;border-radius:50%;background:radial-gradient(circle,rgba(94,122,104,.35),transparent 65%);animation:glow 9s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{transform:translate(-6%,8%) scale(1.15)}}
footer{background:var(--dark);color:var(--cream);padding:0 0 40px;border-top:1px solid rgba(244,241,236,.1)}
.foot{padding-top:56px;display:grid;gap:40px}
.foot .logo b{font-size:1.9rem}
.foot p.tag{color:rgba(244,241,236,.62);max-width:26em;margin-top:18px;font-size:.98rem}
.foot h4{font-family:var(--serif);font-weight:350;font-size:1.35rem;margin-bottom:12px}
.hrs{display:flex;justify-content:space-between;gap:20px;color:rgba(244,241,236,.72);font-size:.95rem;padding:3px 0;max-width:340px}
.foot .conn{color:rgba(244,241,236,.72);font-size:.95rem;line-height:1.9}
.foot .conn a{margin-right:16px;border-bottom:1px solid rgba(244,241,236,.25)}
.foot .conn a:hover{color:#fff;border-color:#fff}
.copy{margin-top:46px;padding-top:24px;border-top:1px solid rgba(244,241,236,.1);color:rgba(244,241,236,.5);font-size:.85rem;display:grid;gap:4px}
.wa.hide{opacity:0;pointer-events:none;transform:scale(.7)}
.wa{transition:opacity .4s,transform .3s var(--ease);position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:56px;height:56px;border-radius:50%;background:#2f9e5f;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);}
.wa:hover{transform:scale(1.08)}
.wa svg{width:28px;height:28px}

/* ============ REVEALS ============ */
.js .rv{opacity:0;transform:translateY(28px)}
.js .rv.in{opacity:1;transform:none;transition:opacity .9s var(--ease) calc(var(--d,0)*1s),transform .9s var(--ease) calc(var(--d,0)*1s)}
.js .hl .ln>span{transform:translateY(112%)}
.js .hl.in .ln>span{transform:none;transition:transform 1.1s var(--ease)}
.js .hl.in .ln:nth-child(2)>span{transition-delay:.1s}.js .hl.in .ln:nth-child(3)>span{transition-delay:.2s}

/* ============ RESPONSIVE ============ */
@media (min-width:760px){
  :root{--pad:40px}
  .nav-links,.pill{display:flex}
  .burger{display:none}
  .claims{grid-template-columns:repeat(3,1fr);gap:28px}
  .claim{flex-direction:column;gap:12px}
  .svc{grid-template-columns:1fr auto;padding:28px 0}
  .svc h3{font-size:2rem}
  .price .num{font-size:2.3rem}
  .gal{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:250px;gap:16px;overflow:visible;margin:0;padding:0}
  .tile{flex:none;aspect-ratio:auto}
  .tile:nth-child(1){grid-column:1/6;grid-row:1/3}
  .tile:nth-child(2){grid-column:6/13;grid-row:1/2}
  .tile:nth-child(3){grid-column:6/10;grid-row:2/3}
  .tile:nth-child(4){grid-column:10/13;grid-row:2/3}
  .book-grid{grid-template-columns:5fr 6fr;gap:70px;align-items:start}
  .card{padding:38px 36px}
  .row2{grid-template-columns:1fr 1fr}
  .foot{grid-template-columns:1.4fr 1fr 1fr}
  .copy{grid-template-columns:1fr auto}
  .p-head{top:96px}
  .panel{padding-top:180px}
}
@media (min-width:1100px){
  .sec-head{grid-template-columns:1fr 1fr;align-items:end}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .mq-track,.hint i::after,.dust i,.closing .glow,.open i{animation:none!important}
  .js .rv,.js .hl .ln>span,.js .tile{opacity:1!important;transform:none!important;clip-path:none!important}
  .svc{opacity:1;transform:none}
  .js .hero .ln>span,.js .hero .fade{transform:none!important;opacity:1!important}
  .hero-img,.hero-light{animation:none!important;transform:none!important}
}
</style>
</head>
